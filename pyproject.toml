[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-agentic-ai"
version = "0.1.0"
description = "Scryfall-backed card discovery and deterministic Commander deck validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=0.84"]
embeddings = ["torch", "transformers>=5.21"]
tui = ["textual>=8.2"]

[project.scripts]
mtg-agentic = "mtg_agentic.__main__:main"

[tool.setuptools.packages.find]
include = ["mtg_agentic*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
